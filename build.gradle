buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url = 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }
}

configure(subprojects) {
    version = '1.0'
}
